id: b5ca971c-0943-423b-b6e0-3c7b27aa898a
name: Post-request — tests
method: GET
url: "{{baseUrl}}/get"
postScript: |-
  // A post-request script runs AFTER the response arrives. Use mt.test(...) with
  // mt.expect(...) to assert on the response; results show in the Tests tab.
  mt.test("status is 200", function () {
    mt.expect(mt.response.code).to.equal(200);
  });

  mt.test("responds in under 2s", function () {
    mt.expect(mt.response.responseTime).to.be.below(2000);
  });

  mt.test("body is JSON echoing the request url", function () {
    const body = mt.response.json();
    mt.expect(body).to.have.property("url");
    mt.expect(body.url).to.include("/get");
  });

  mt.test("Content-Type is JSON", function () {
    mt.expect(mt.response.headers.get("Content-Type")).to.include("application/json");
  });
