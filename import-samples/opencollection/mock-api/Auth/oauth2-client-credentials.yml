info:
  name: OAuth2 client credentials
  type: http
  seq: 7
http:
  method: GET
  url: "{{baseUrl}}/anything"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: http://localhost:8081/default/token
    credentials:
      clientId: impostor
      clientSecret: impostor-secret
      placement: body
    scope: api.read
    settings:
      autoFetchToken: true
