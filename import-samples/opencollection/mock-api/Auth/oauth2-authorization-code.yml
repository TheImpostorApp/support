info:
  name: OAuth2 authorization code (PKCE)
  type: http
  seq: 8
http:
  method: GET
  url: "{{baseUrl}}/anything"
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: http://localhost:8081/default/authorize
    accessTokenUrl: http://localhost:8081/default/token
    callbackUrl: http://localhost:8089/callback
    credentials:
      clientId: impostor
      clientSecret: impostor-secret
      placement: body
    scope: openid
    pkce:
      method: S256
