# A standalone environment file — the shape Bruno writes under `environments/`.
# Picked on its own it imports straight into the workspace's environments.
name: Staging (OpenCollection)
color: "#f9e2af"
variables:
  - name: baseUrl
    value: https://staging.example.com
  - name: authToken
    value: staging-token
  - secret: true
    name: stagingSecret
  - name: retired
    value: "0"
    disabled: true
